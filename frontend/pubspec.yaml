name: tradevision_ai
description: "TradeVision AI - Premium AI-powered stock market application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^26.2.14
  intl: ^0.19.0
  google_fonts: ^6.2.1
  http: ^1.2.0
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  flutter_riverpod: ^2.5.1
  go_router: ^13.0.0
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.2
  file_picker: ^8.1.2
  connectivity_plus: ^6.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo_icon.png"
    background_color: "#0A0E1A"
    theme_color: "#0066CC"
  windows:
    generate: true
    image_path: "assets/images/logo_icon.png"
    icon_size: 48
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/images/logo_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/logo_full.png
    - assets/images/logo_icon.png
