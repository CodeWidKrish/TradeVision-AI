<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TradeVision - AI-Powered Market Intelligence & Real-time Stock Analytics.">

  <!-- Prevent browser zoom on double tap and pinch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Tell browser this is a standalone app — removes browser chrome -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TradeVision">
  <meta name="theme-color" content="#0A0E1A">

  <!-- iOS icons & Favicon -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TradeVision</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Disable browser pull-to-refresh completely */
    html, body {
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      touch-action: pan-x pan-y;
      background-color: #0A0E1A;
    }

    /* Prevent text selection on tap (native app feel) */
    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    /* Allow text selection only in input fields */
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    /* Remove browser scrollbar */
    ::-webkit-scrollbar {
      display: none;
    }

    /* Prevent bounce/rubber-band scroll on iOS */
    body {
      position: fixed;
      overflow: hidden;
    }

    /* Flutter canvas fills full screen */
    #flutter-app, flt-glass-pane, flt-scene-host {
      touch-action: none;
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Prevent pull-to-refresh on Chrome Android
    document.addEventListener('touchstart', function(e) {}, { passive: true });

    document.body.addEventListener('touchmove', function(e) {
      // Only prevent if we're at the top of the scroll
      if (document.scrollingElement && document.scrollingElement.scrollTop === 0) {
        e.preventDefault();
      }
    }, { passive: false });

    // Prevent browser context menu on long press
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    });

    // Prevent browser back gesture interfering with app navigation
    window.addEventListener('popstate', function(e) {
      e.preventDefault();
    });

    // Disable F5 / Ctrl+R page reload in browser
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
